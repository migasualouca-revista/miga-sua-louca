<script src="https://cdn.jsdelivr.net/npm/page-flip@2.0.7/dist/js/page-flip.browser.js"></script><script>
const issues={"homem": {"title": "Homem bonito dá trabalho?", "folder": "homem-bonito", "pages": 5}, "faxina": {"title": "Faxina de Fim de Ano", "folder": "faxina-fim-de-ano", "pages": 6}, "rosa": {"title": "Rosa-Choque, Meu Primeiro Amor!", "folder": "rosa-choque", "pages": 5}, "bonita": {"title": "Bonita, Cheirosa e Perigosamente Parcelada!", "folder": "bonita-cheirosa-parcelada", "pages": 4}, "adulto": {"title": "Ninguém Sabe o Que Está Fazendo!", "folder": "ninguem-sabe-o-que-esta-fazendo", "pages": 4}, "adolescencia": {"title": "A Adolescência Voltou!", "folder": "a-adolescencia-voltou", "pages": 6}, "vermelho": {"title": "O Vermelho Incomoda?", "folder": "o-vermelho-incomoda", "pages": 5}, "pulseirinha": {"title": "Cadê a Pulseirinha do Reggae?", "folder": "pulseirinha-do-reggae", "pages": 5}, "salvei": {"title": "Salvei pra Ver Depois", "folder": "salvei-pra-ver-depois", "pages": 5}, "eixos": {"title": "Sua Vida nos Eixos", "folder": "sua-vida-nos-eixos", "pages": 5}};
let active=null,flipbook=null,lastPage=-1,fallbackPage=0;
const reader=document.getElementById('reader'),host=document.getElementById('flip-host'),book=document.getElementById('book'),prev=document.getElementById('prev'),next=document.getElementById('next'),count=document.getElementById('count');
function record(page){if(!active||page<0||page>=active.pages||page===lastPage)return;lastPage=page;if(!modoEditora&&typeof gtag==='function')gtag('event','pagina_folheada',{edicao:active.folder,numero_pagina:page+1});}
function update(page){count.innerHTML=`${page+1} / ${active.pages}<br>${flipbook?'Arraste a folha para virar':'Use as setas para folhear'}`;prev.disabled=page===0;next.disabled=page===active.pages-1;record(page);}
function showFallback(page){fallbackPage=Math.max(0,Math.min(active.pages-1,page));book.replaceChildren();const wrap=document.createElement('div');wrap.className='fallback-page';const img=document.createElement('img');img.alt=`Página ${fallbackPage+1}`;img.src=`edicoes/${active.folder}/${String(fallbackPage+1).padStart(2,'0')}.png`;wrap.appendChild(img);book.appendChild(wrap);update(fallbackPage);}
function openIssue(key){if(!issues[key])return;active=issues[key];lastPage=-1;fallbackPage=0;if(flipbook){try{flipbook.destroy()}catch(e){}flipbook=null}book.replaceChildren();host.classList.remove('enlarged');document.getElementById('zoom').textContent='Ampliar';document.getElementById('issue-title').textContent=active.title;reader.classList.add('active');document.body.style.overflow='hidden';if(!modoEditora&&typeof gtag==='function')gtag('event','edicao_aberta',{edicao:active.folder,titulo_edicao:active.title});if(typeof St==='undefined'||typeof St.PageFlip!=='function'){showFallback(0);return}try{for(let n=1;n<=active.pages;n++){const sheet=document.createElement('div');sheet.className='page';if(n===1)sheet.dataset.density='hard';const img=document.createElement('img');img.alt=`Página ${n} de ${active.pages}`;img.src=`edicoes/${active.folder}/${String(n).padStart(2,'0')}.png`;sheet.appendChild(img);book.appendChild(sheet)}flipbook=new St.PageFlip(book,{width:450,height:600,size:'stretch',minWidth:260,maxWidth:520,minHeight:347,maxHeight:693,drawShadow:true,flippingTime:950,usePortrait:true,showCover:true,startPage:0,mobileScrollSupport:false,swipeDistance:25,clickEventForward:true,maxShadowOpacity:.55,autoSize:true});flipbook.loadFromHTML(book.querySelectorAll('.page'));flipbook.on('flip',e=>update(e.data));update(0)}catch(error){console.error('Leitor indisponível:',error);try{if(flipbook)flipbook.destroy()}catch(e){}flipbook=null;showFallback(0)}}
document.querySelectorAll('[data-issue]').forEach(button=>button.addEventListener('click',()=>openIssue(button.dataset.issue)));
document.getElementById('close').onclick=()=>{reader.classList.remove('active');document.body.style.overflow='';if(flipbook){try{flipbook.destroy()}catch(e){}flipbook=null}book.replaceChildren()};prev.onclick=()=>{if(flipbook)flipbook.flipPrev();else showFallback(fallbackPage-1)};next.onclick=()=>{if(flipbook)flipbook.flipNext();else showFallback(fallbackPage+1)};document.getElementById('zoom').onclick=()=>{host.classList.toggle('enlarged');document.getElementById('zoom').textContent=host.classList.contains('enlarged')?'Reduzir':'Ampliar';if(flipbook)flipbook.update()};document.addEventListener('keydown',e=>{if(!reader.classList.contains('active'))return;if(e.key==='Escape')document.getElementById('close').click();if(e.key==='ArrowRight')next.click();if(e.key==='ArrowLeft')prev.click()});
</script></body></html>
