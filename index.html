<style>
:root{color-scheme:light}*{box-sizing:border-box}
body{margin:0;background:#fff9f5;color:#251720;font-family:Arial,sans-serif}
header{text-align:center;padding:42px 15px 30px;border-bottom:1px solid #ead9e1}
header small{letter-spacing:5px;color:#a43e68;font-weight:700}
header h1{color:#e50064;font-size:clamp(48px,10vw,86px);margin:12px 0 0}
header em{font:bold italic 34px Georgia,serif}header p{color:#73666d}
main{max-width:950px;margin:auto;padding:35px 22px 80px}
h2{font:bold clamp(27px,5vw,43px) Georgia,serif}
.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.issue{border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:0}
.issue img{width:100%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 4px 18px #0002}
.issue strong{display:block;margin-top:12px;font-size:18px}.issue span{display:block;color:#97516f;margin-top:6px}
.reader{display:none;position:fixed;inset:0;background:#161018;color:white;z-index:2;flex-direction:column}
.reader.active{display:flex}
.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:#281924;gap:10px}
.bar strong{color:#ffd361}
.bar button,.nav button{border:1px solid #76576b;border-radius:25px;background:#51334b;color:white;padding:11px 16px;font-weight:bold;cursor:pointer}
.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:auto;padding:12px;touch-action:pan-y}
.book{position:relative;display:flex;height:min(100%,76vw);aspect-ratio:1.5/1;max-width:100%;perspective:1800px;filter:drop-shadow(0 8px 20px #0008)}
.sheet{width:50%;height:100%;position:relative;background:#fff;overflow:hidden}
.sheet img{width:100%;height:100%;object-fit:contain;display:block;background:#fff}
.sheet.left{box-shadow:inset -12px 0 16px #0002}.sheet.right{box-shadow:inset 12px 0 16px #0002}
.book:after{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:#0004;transform:translateX(-50%);pointer-events:none}
.flip{display:none;position:absolute;z-index:5;top:0;left:50%;width:50%;height:100%;transform-style:preserve-3d;transform-origin:left center}
.flip.active{display:block;animation:flipForward .72s cubic-bezier(.3,.05,.55,1) forwards}
.flip.backward{left:0;transform-origin:right center;animation:flipBackward .72s cubic-bezier(.3,.05,.55,1) forwards}
.face{position:absolute;inset:0;backface-visibility:hidden;background:#fff;box-shadow:0 3px 12px #0005;overflow:hidden}
.face img{height:100%;width:100%;object-fit:contain}
.face.back{transform:rotateY(180deg)}
@keyframes flipForward{from{transform:rotateY(0)}to{transform:rotateY(-180deg)}}
@keyframes flipBackward{from{transform:rotateY(0)}to{transform:rotateY(180deg)}}
.stage.zoom .book{height:120%;max-width:none}
.nav{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#281924;gap:10px}
.nav button:disabled{opacity:.35}.nav span{text-align:center;font-size:14px}
footer{text-align:center;color:#806e78;padding:35px}
button:focus-visible{outline:3px solid #ffca46}
@media(max-width:600px){
main{padding:25px 16px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}
.issue strong{font-size:15px}.issue span{font-size:12px}h2{font-size:27px}
.book{aspect-ratio:3/4;height:min(100%,125vw)}
.sheet{width:100%}.sheet.left{display:none}.sheet.right{box-shadow:none}
.book:after{display:none}
.flip,.flip.backward{left:0;width:100%;transform-origin:left center}
}
@media(prefers-reduced-motion:reduce){.flip.active,.flip.backward{animation-duration:.01s}}
</style>
</head>
<body>
<header><small>REVISTA DIGITAL</small><h1>MIGA</h1><em>Sua Louca!</em><p>Tem coisa que só uma revista entende.</p></header>
<main><h2>Escolha uma capa e folheie</h2><div class="grid">
<button class="issue" data-issue="homem"><img src="edicoes/homem-bonito/01.png" alt="Capa da revista Homem bonito dá trabalho?"><strong>Homem bonito dá trabalho?</strong><span>Comportamento · 5 páginas</span></button>
<button class="issue" data-issue="faxina"><img src="edicoes/faxina-fim-de-ano/01.png" alt="Capa da revista Faxina de Fim de Ano"><strong>Faxina de Fim de Ano</strong><span>Organização e humor · 6 páginas</span></button>
<button class="issue" data-issue="rosa"><img src="edicoes/rosa-choque/01.png" alt="Capa da revista Rosa-Choque, Meu Primeiro Amor!"><strong>Rosa-Choque, Meu Primeiro Amor!</strong><span>Moda e verão · 5 páginas</span></button>
</div></main>
<footer>MIGA, SUA LOUCA! · Nossa banca digital</footer>
<section class="reader" id="reader" role="dialog" aria-label="Leitor da revista">
<div class="bar"><div><strong>MIGA, SUA LOUCA!</strong><div id="issue-title" style="font-size:13px"></div></div><div><button id="zoom">Ampliar</button> <button id="close">Fechar ×</button></div></div>
<div class="stage" id="stage"><div class="book" id="book">
<div class="sheet left"><img id="left-page" alt="Página esquerda"></div>
<div class="sheet right"><img id="page" alt="Página direita"></div>
<div class="flip" id="flip"><div class="face front"><img id="flip-front" alt=""></div><div class="face back"><img id="flip-back" alt=""></div></div>
</div></div>
<div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next">Próxima →</button></div>
</section>
<script>
const issues={
homem:{title:'Homem bonito dá trabalho?',folder:'homem-bonito',pages:5},
faxina:{title:'Faxina de Fim de Ano',folder:'faxina-fim-de-ano',pages:6},
rosa:{title:'Rosa-Choque, Meu Primeiro Amor!',folder:'rosa-choque',pages:5}
};
let active=issues.homem,i=0,busy=false;
const reader=document.getElementById('reader'),stage=document.getElementById('stage');
const page=document.getElementById('page'),left=document.getElementById('left-page'),flip=document.getElementById('flip');
const front=document.getElementById('flip-front'),back=document.getElementById('flip-back');
const mobile=()=>window.matchMedia('(max-width:600px)').matches;
const path=n=>n>=0&&n<active.pages?`edicoes/${active.folder}/${String(n+1).padStart(2,'0')}.png`:null;
function record(n){
if(typeof gtag==='function')gtag('event','pagina_folheada',{edicao:active.folder,numero_pagina:n+1});
}
function display(log=true){
const single=mobile(),right=single?i:(i===0?0:i+1),leftIndex=single?-1:(i===0?-1:i);
page.src=path(right)||'';page.style.visibility=path(right)?'visible':'hidden';
left.src=path(leftIndex)||'';left.style.visibility=path(leftIndex)?'visible':'hidden';
page.alt=`Página ${right+1} de ${active.pages}`;
const count=single?`${i+1} / ${active.pages}`:(i===0?'Capa · 1 / '+active.pages:`Páginas ${i+1}–${Math.min(i+2,active.pages)} / ${active.pages}`);
document.getElementById('count').innerHTML=count+'<br>Deslize para folhear';
document.getElementById('prev').disabled=i===0;
document.getElementById('next').disabled=single?i===active.pages-1:i>=active.pages-1;
if(log){if(single)record(i);else{if(leftIndex>=0)record(leftIndex);if(right<active.pages)record(right)}}
}
function move(dir){
if(busy)return;
const single=mobile(),step=single?1:2;
const target=single?i+dir:dir>0?(i===0?1:i+2):(i===1?0:i-2);
if(target<0||target>=active.pages)return;
busy=true;
const oldRight=single?i:(i===0?0:i+1),newRight=single?target:target+1;
const oldLeft=single?-1:(i===0?-1:i),newLeft=single?-1:(target===0?-1:target);
front.src=path(dir>0?oldRight:oldLeft)||path(oldRight)||'';
back.src=path(dir>0?newLeft:newRight)||path(newRight)||'';
flip.className='flip';
void flip.offsetWidth;
flip.classList.add('active');
if(dir<0)flip.classList.add('backward');
const old=i;
i=target;
display(false);
setTimeout(()=>{
flip.className='flip';busy=false;
if(single)record(i);else{
if(newLeft>=0&&newLeft!==oldLeft&&newLeft!==oldRight)record(newLeft);
if(newRight<active.pages&&newRight!==oldRight&&newRight!==oldLeft)record(newRight);
}
},740);
}
document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{
active=issues[b.dataset.issue];i=0;busy=false;flip.className='flip';
document.getElementById('issue-title').textContent=active.title;
if(typeof gtag==='function')gtag('event','edicao_aberta',{edicao:active.folder,titulo_edicao:active.title});
stage.classList.remove('zoom');reader.classList.add('active');display();
});
document.getElementById('close').onclick=()=>reader.classList.remove('active');
document.getElementById('prev').onclick=()=>move(-1);
document.getElementById('next').onclick=()=>move(1);
document.getElementById('zoom').onclick=()=>stage.classList.toggle('zoom');
let sx=0;
stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});
stage.addEventListener('touchend',e=>{const dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&!stage.classList.contains('zoom'))move(dx<0?1:-1)},{passive:true});
document.addEventListener('keydown',e=>{
if(!reader.classList.contains('active'))return;
if(e.key==='Escape')reader.classList.remove('active');
if(e.key==='ArrowRight')move(1);
if(e.key==='ArrowLeft')move(-1);
});
window.addEventListener('resize',()=>{if(reader.classList.contains('active')&&!busy){if(!mobile()&&i%2===0&&i>0)i--;display(false)}});
</script></body></html>
