<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Miga, Sua Louca! — Banca Digital</title><style>:root{color-scheme:light}*{box-sizing:border-box}body{margin:0;background:#fff9f5;color:#251720;font-family:Arial,sans-serif}header{text-align:center;padding:42px 15px 30px;border-bottom:1px solid #ead9e1}header small{letter-spacing:5px;color:#a43e68;font-weight:700}header h1{color:#e50064;font-size:clamp(48px,10vw,86px);margin:12px 0 0}header em{font:bold italic 34px Georgia,serif}header p{color:#73666d}main{max-width:950px;margin:auto;padding:35px 22px 80px}h2{font:bold clamp(27px,5vw,43px) Georgia,serif}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}.issue{border:0;background:none;text-align:left;cursor:pointer;color:inherit;font:inherit;padding:0}.issue img{width:100%;aspect-ratio:3/4;object-fit:cover;box-shadow:0 4px 18px #0002}.issue strong{display:block;margin-top:12px;font-size:18px}.issue span{display:block;color:#97516f;margin-top:6px}.reader{display:none;position:fixed;inset:0;background:#161018;color:white;z-index:2;flex-direction:column}.reader.active{display:flex}.bar{display:flex;align-items:center;justify-content:space-between;padding:12px 15px;background:#281924;gap:10px}.bar strong{color:#ffd361}.bar button,.nav button{border:1px solid #76576b;border-radius:25px;background:#51334b;color:white;padding:11px 16px;font-weight:bold;cursor:pointer}.stage{flex:1;min-height:0;display:flex;justify-content:center;align-items:center;overflow:auto;touch-action:pan-y}.stage img{display:block;max-width:100%;max-height:100%;object-fit:contain}.stage.zoom img{max-width:none;max-height:none;width:150%;height:auto}.nav{display:flex;justify-content:space-between;align-items:center;padding:13px;background:#281924;gap:10px}.nav button:disabled{opacity:.35}.nav span{text-align:center;font-size:14px}footer{text-align:center;color:#806e78;padding:35px}button:focus-visible{outline:3px solid #ffca46}@media(max-width:600px){main{padding:25px 16px 60px}.grid{grid-template-columns:repeat(2,minmax(0,1fr));gap:14px}.issue strong{font-size:15px}.issue span{font-size:12px}.issue img{aspect-ratio:3/4}h2{font-size:27px}} </style></head><body><header><small>REVISTA DIGITAL</small><h1>MIGA</h1><em>Sua Louca!</em><p>A gente cresceu. Mas continua sem juízo!</p></header><main><h2>Escolha uma capa e folheie</h2><div class="grid"><button class="issue" data-issue="homem"><img src="edicoes/homem-bonito/01.png" alt="Capa da revista Homem bonito dá trabalho?"><strong>Homem bonito dá trabalho?</strong><span>Comportamento · 5 páginas</span></button><button class="issue" data-issue="faxina"><img src="edicoes/faxina-fim-de-ano/01.png" alt="Capa da revista Faxina de Fim de Ano"><strong>Faxina de Fim de Ano</strong><span>Organização e humor · 6 páginas</span></button></div></main><footer>MIGA, SUA LOUCA! · Nossa banca digital</footer><section class="reader" id="reader" role="dialog" aria-label="Leitor da revista"><div class="bar"><div><strong>MIGA, SUA LOUCA!</strong><div id="issue-title" style="font-size:13px"></div></div><div><button id="zoom">Ampliar</button> <button id="close">Fechar ×</button></div></div><div class="stage" id="stage"><img id="page" alt="Página da revista"></div><div class="nav"><button id="prev">← Anterior</button><span id="count"></span><button id="next">Próxima →</button></div></section><script>const issues={homem:{title:'Homem bonito dá trabalho?',folder:'homem-bonito',pages:5},faxina:{title:'Faxina de Fim de Ano',folder:'faxina-fim-de-ano',pages:6}};let active=issues.homem,i=0;const reader=document.getElementById('reader'),stage=document.getElementById('stage');function show(){document.getElementById('page').src=`edicoes/${active.folder}/${String(i+1).padStart(2,'0')}.png`;document.getElementById('page').alt=`Página ${i+1} de ${active.pages}`;document.getElementById('count').innerHTML=`${i+1} / ${active.pages}<br>Deslize para folhear`;document.getElementById('prev').disabled=i===0;document.getElementById('next').disabled=i===active.pages-1;stage.classList.remove('zoom')}document.querySelectorAll('[data-issue]').forEach(b=>b.onclick=()=>{active=issues[b.dataset.issue];i=0;document.getElementById('issue-title').textContent=active.title;show();reader.classList.add('active')});document.getElementById('close').onclick=()=>reader.classList.remove('active');document.getElementById('prev').onclick=()=>{if(i>0){i--;show()}};document.getElementById('next').onclick=()=>{if(i<active.pages-1){i++;show()}};document.getElementById('zoom').onclick=()=>stage.classList.toggle('zoom');let sx=0;stage.addEventListener('touchstart',e=>{sx=e.touches[0].clientX},{passive:true});stage.addEventListener('touchend',e=>{let dx=e.changedTouches[0].clientX-sx;if(Math.abs(dx)>60&&!stage.classList.contains('zoom')){if(dx<0&&i<active.pages-1)i++;if(dx>0&&i>0)i--;show()}},{passive:true});document.addEventListener('keydown',e=>{if(!reader.classList.contains('active'))return;if(e.key==='Escape')reader.classList.remove('active');if(e.key==='ArrowRight'&&i<active.pages-1){i++;show()}if(e.key==='ArrowLeft'&&i>0){i--;show()}})</script></body></html>
